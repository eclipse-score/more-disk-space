name: Test

on:
  workflow_call:
  workflow_dispatch:

permissions:
  actions: read
  checks: read
  contents: read

jobs:
  # Tests each level: freed space must reach the expected minimum.
  # Thresholds are ~10% below the 100-round benchmark medians (results.md).
  test-levels:
    name: level ${{ matrix.level }} | ${{ matrix.image }}
    runs-on: ${{ matrix.image }}
    env:
      ANDROID_HOME: /usr/local/lib/android/sdk
      ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
    strategy:
      fail-fast: false
      matrix:
        include:
          # level 0 must not clean up anything; freed space should stay near zero
          - image: ubuntu-24.04
            level: 0
            min_gib: 0
          # min_gib: conservative floor ~10% below 100-round benchmark median
          - image: ubuntu-24.04
            level: 1
            min_gib: 15
          - image: ubuntu-24.04
            level: 2
            min_gib: 20
          - image: ubuntu-24.04
            level: 3
            min_gib: 24
          - image: ubuntu-24.04
            level: 4
            min_gib: 25

    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Measure before
        id: before
        uses: ./.github/actions/measure-before

      - name: Run more-disk-space
        uses: ./
        with:
          level: ${{ matrix.level }}

      - name: Verify Android SDK environment
        env:
          LEVEL: ${{ matrix.level }}
        run: |
          set -euo pipefail

          if [[ "$LEVEL" -ge 3 ]]; then
            [[ -z "${ANDROID_HOME:-}" ]]
            [[ -z "${ANDROID_SDK_ROOT:-}" ]]
          else
            [[ "${ANDROID_HOME:-}" == "/usr/local/lib/android/sdk" ]]
            [[ "${ANDROID_SDK_ROOT:-}" == "/usr/local/lib/android/sdk" ]]
          fi

      - name: Measure after
        shell: bash
        env:
          LEVEL: ${{ matrix.level }}
          MIN_GIB: ${{ matrix.min_gib }}
          IMAGE: ${{ matrix.image }}
          BEFORE_ROOT: ${{ steps.before.outputs.root_avail }}
          START_TS: ${{ steps.before.outputs.start_ts }}
        run: |
          set -euo pipefail

          END_TS=$(date +%s%3N)
          DURATION=$((END_TS - START_TS))

          AFTER_ROOT=$(df --output=avail -B1 / | tail -1)
          FREED_ROOT=$(( AFTER_ROOT - BEFORE_ROOT ))

          to_gib() { echo "scale=1; $1 / 1073741824" | bc; }
          BEFORE_GIB=$(to_gib "$BEFORE_ROOT")
          AFTER_GIB=$(to_gib "$AFTER_ROOT")
          FREED_GIB=$(to_gib "$FREED_ROOT")

          FREED_GIB_EXACT=$(echo "scale=4; $FREED_ROOT / 1073741824" | bc)
          if (( $(echo "$FREED_GIB_EXACT < $MIN_GIB" | bc -l) )); then STATUS=fail; else STATUS=pass; fi

          mkdir -p result
          echo "${LEVEL},${MIN_GIB},${IMAGE},${BEFORE_GIB},${AFTER_GIB},${FREED_GIB},${DURATION},${STATUS}" > result/result.csv

      - name: Upload result
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: result-level-${{ matrix.level }}-${{ matrix.image }}
          path: result/result.csv

  problem-matcher-enabled:
    name: problem matcher enabled
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run more-disk-space with default matcher setting
        uses: ./
        with:
          level: 0

      - name: Emit representative disk-space errors
        run: |
          printf 'MATCHER_BAZEL: Bazel: No %s left on device\n' space
          printf 'MATCHER_ENOSPC: tool failed with E%s\n' NOSPC
          printf "MATCHER_APT: E: You don't have enough free %s in /var/cache/apt/archives/.\n" space
          printf 'MATCHER_IGNORED_ENOSPC: E%s: System limit for number of file watchers reached\n' NOSPC
          printf 'MATCHER_IGNORED_NO_SPACE: inotify_add_watch failed: No %s left on device\n' space

  problem-matcher-disabled:
    name: problem matcher disabled
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Run more-disk-space with matchers disabled
        uses: ./
        with:
          level: 0
          enable-problem-matchers: false

      - name: Emit a disk-space error that must not be annotated
        run: |
          printf 'MATCHER_DISABLED: Bazel: No %s left on device\n' space

  verify-problem-matchers:
    name: Verify problem matcher annotations
    runs-on: ubuntu-24.04
    needs: [problem-matcher-enabled, problem-matcher-disabled]
    steps:
      - name: Verify annotations through the GitHub API
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          JOBS=$(gh api \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/actions/runs/$GITHUB_RUN_ID/attempts/$GITHUB_RUN_ATTEMPT/jobs?per_page=100")

          check_run_id() {
            local job_name=$1
            jq -er --arg job_name "$job_name" '
              [.jobs[] | select(.name | endswith($job_name))]
              | if length == 1
                then .[0].check_run_url | split("/")[-1]
                else error("expected exactly one job ending in: " + $job_name)
                end
            ' <<< "$JOBS"
          }

          ENABLED_ID=$(check_run_id "problem matcher enabled")
          DISABLED_ID=$(check_run_id "problem matcher disabled")

          ENABLED=$(gh api \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/check-runs/$ENABLED_ID/annotations?per_page=100")
          DISABLED=$(gh api \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "repos/$GITHUB_REPOSITORY/check-runs/$DISABLED_ID/annotations?per_page=100")

          assert_count() {
            local annotations=$1
            local marker=$2
            local expected=$3
            local actual
            actual=$(jq --arg marker "$marker" \
              '[.[] | select(.message | contains($marker))] | length' \
              <<< "$annotations")
            if [[ "$actual" -ne "$expected" ]]; then
              echo "Expected $expected annotation(s) for $marker, found $actual" >&2
              return 1
            fi
          }

          assert_count "$ENABLED" "MATCHER_BAZEL" 1
          assert_count "$ENABLED" "MATCHER_ENOSPC" 1
          assert_count "$ENABLED" "MATCHER_APT" 1
          assert_count "$ENABLED" "MATCHER_IGNORED_ENOSPC" 0
          assert_count "$ENABLED" "MATCHER_IGNORED_NO_SPACE" 0
          assert_count "$DISABLED" "MATCHER_DISABLED" 0

  summary:
    name: Summary
    runs-on: ubuntu-24.04
    needs: [test-levels]
    if: always()
    steps:
      - name: Download results
        uses: actions/download-artifact@v8
        with:
          pattern: result-*
          path: results

      - name: Build summary table
        shell: bash
        run: |
          set -euo pipefail

          ALL=$(find results -name "result.csv" -exec cat {} \;)

          PASS=$(echo "$ALL" | grep -c ',pass$' || true)
          FAIL=$(echo "$ALL" | grep -c ',fail$' || true)

          {
            echo "## Test Results"
            echo ""
            echo "### Levels 0–4"
            echo ""
            echo "| Image | Level | Min (GiB) | Before | After | Freed | Duration | |"
            echo "|---|---:|---:|---:|---:|---:|---:|:---:|"
            echo "$ALL" \
              | sort -t, -k3,3 -k1,1n \
              | while IFS=, read -r level min_gib image before after freed duration status; do
                  if [[ "$status" == pass ]]; then icon="✅"; else icon="❌"; fi
                  echo "| \`${image}\` | ${level} | ${min_gib} | ${before} | ${after} | ${freed} | ${duration}ms | ${icon} |"
                done
            echo ""
            echo "${PASS} passed, ${FAIL} failed"
          } >> "$GITHUB_STEP_SUMMARY"

          echo "${PASS} passed, ${FAIL} failed"
          [[ "$FAIL" -eq 0 ]]
